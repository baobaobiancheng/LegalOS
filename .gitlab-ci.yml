# LegalOS GitLab CI（P1-12）
# 自建 GitLab(http://git.100credit.cn)。干净 Runner 应能完整跑通。
# 安全:测试库密码用 GitLab masked/protected variable TEST_DATABASE_URL;不打印 env;不缓存 .env/storage。

stages:
  - validate
  - test
  - integration
  - build
  - e2e
  - security

variables:
  NODE_VERSION: "24"
  MYSQL_VERSION: "8.0"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - node_modules/
    - api/node_modules/
    - web/node_modules/
  policy: pull-push

# 依赖安装（所有阶段复用）
.deps: &deps
  image: node:${NODE_VERSION}
  before_script:
    - node -v && npm -v
    - npm ci
    - npm --prefix api ci
    - npm --prefix web ci

validate:prisma:
  stage: validate
  image: node:${NODE_VERSION}
  before_script:
    - npm --prefix api ci
  script:
    - cd api
    - |
      schema_copy="$(mktemp)"
      cp prisma/schema.prisma "$schema_copy"
      npx prisma format --schema "$schema_copy"
      cmp --silent prisma/schema.prisma "$schema_copy" || {
        echo "prisma/schema.prisma is not formatted; run: npx prisma format"
        rm -f "$schema_copy"
        exit 1
      }
      rm -f "$schema_copy"
    - npx prisma validate
    - npx prisma generate

validate:docs:
  stage: validate
  image: node:${NODE_VERSION}
  script:
    - node scripts/check-doc-links.mjs   # P2-05 文档链接 + 陈旧内容门禁(失败即 job 失败)

test:api-unit:
  stage: test
  <<: *deps
  script:
    - cd api && npm run test:unit

test:web-unit:
  stage: test
  <<: *deps
  script:
    - npm --prefix web run test

test:typecheck:
  stage: test
  <<: *deps
  script:
    - npm run typecheck

test:lint:
  stage: test
  <<: *deps
  script:
    - npm run lint

integration:mysql:
  stage: integration
  image: node:${NODE_VERSION}
  services:
    - name: mysql:${MYSQL_VERSION}
      alias: mysql
      command: ["--default-authentication-plugin=mysql_native_password"]
  variables:
    MYSQL_ROOT_PASSWORD: legalos_ci_root
    MYSQL_DATABASE: legalos_test
  before_script:
    - npm --prefix api ci
  script:
    - cd api
    - DATABASE_URL="mysql://root:legalos_ci_root@mysql:3306/legalos_test" npx prisma migrate deploy
    - DATABASE_URL="mysql://root:legalos_ci_root@mysql:3306/legalos_test" TEST_DATABASE_URL="mysql://root:legalos_ci_root@mysql:3306/legalos_test" npm run test:integration
  after_script:
    - echo "integration done"

build:api:
  stage: build
  <<: *deps
  script:
    - npm --prefix api run build
    - npm --prefix api run dsh:runtime-gate

build:web:
  stage: build
  <<: *deps
  script:
    - npm --prefix web run build

e2e:smoke:
  stage: e2e
  image: node:${NODE_VERSION}
  before_script:
    - npm --prefix web ci
    - npx --prefix web playwright install --with-deps chromium
  script:
    - npm --prefix web run test:e2e

security:audit:
  stage: security
  image: node:${NODE_VERSION}
  before_script:
    - npm --prefix api ci
  script:
    # P1-12 门禁：任一 high/critical 依赖漏洞使 Pipeline 失败（不静默跳过）。
    # 若内部 npm 镜像不支持 audit，会在此失败并需接入公司依赖扫描，而不是吞掉。
    - cd api && npm audit --audit-level=high
    - cd ../web && npm audit --audit-level=high
