# LegalOS 嵌入 dsh 的最小配置树（DshService 库嵌入用，参见迁移计划
# /Users/admin/.claude/plans/kind-prancing-stream.md 的 D2 决策）。
#
# 只挂库嵌入、会话、上下文压缩与应用注册的只读工具所需能力；base bundle 里的
# shell、浏览器、代码运行、Codex/Claude Code 子代理和技能系统不挂载 —— 保持
# 生产法务 Agent 的能力面尽量小。会话持久化用默认 JSONL（D1 决策：双写，
# LegalOS 业务表继续只存结构化摘要，不依赖这里落盘的原始事件）。
#
# 模型配置（优先 DSH_LLM_*，兼容回退 LLM_* / CODEX_API_KEY）由 DshService 在启动时
# 通过 --patch 覆盖 llm-pi-ai 行的 config，而不是写死在这个文件里，
# 因为 LegalOS 的网关地址/模型名/凭证来自 NestJS 的 ConfigService。

- id: timer
  name: '@deepseek-ai/cordis-plugin-timer'

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-retry
  name: '@deepseek-ai/dsh-llm-retry'

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

# providers 留空：DshService 启动时通过 --patch 注入真实网关路由
# （动态 route key，默认 legalos-dsh，见 dsh.service.ts bootDsh()）。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')

- id: tools
  name: '@deepseek-ai/dsh-tools'

# 复用 dsh base bundle 的原生防循环机制：对连续的“同工具 + 同参数”
# 调用在 3/5/8 次递进提醒模型检查已有结果。插件只注入语义化提醒，
# 不拒绝调用；LegalOS 仍在应用层保留单轮总次数硬上限。
- id: repeat-tool-reminder
  name: '@deepseek-ai/dsh-repeat-tool-reminder'
  config:
    thresholds: [3, 5, 8]
    include: [search_laws, search_similar_cases]
    argumentsPreviewChars: 500

# 在模型请求和只读工具执行前持久化上一个语义边界，
# 使崩溃后 resume 可以从完整的 call/result 日志恢复。
- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

# dsh 原生上下文压缩：先确定性裁剪过大工具结果，仍超压力阈值时再摘要旧会话。
- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: tool-result-pruner
  name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
  config:
    thresholdChars: 8192
    headChars: 4096
    tailChars: 1024

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
    maxOverflowRetries: 1

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    persona: ''

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: legalos-dsh
    model: placeholder

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    # 百鉴单工具串行执行；应用层另有每轮总调用数硬上限。
    maxParallelToolCalls: 1
    agents: []
