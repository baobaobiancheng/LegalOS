<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude Code 命令手册</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --sub: #6e6e73;
    --blue: #0071e3; --border: rgba(0,0,0,.08); --spring: cubic-bezier(.34,1.56,.64,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); padding: 40px 24px 80px; }
  .wrap { max-width: 980px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 36px; animation: rise .5s var(--spring) both; }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .sub { color: var(--sub); font-size: 14px; margin-top: 8px; }
  .count { display: inline-block; margin-top: 12px; font-size: 12px; color: var(--blue); background: rgba(0,113,227,.08); padding: 3px 12px; border-radius: 999px; font-weight: 600; }

  .search-box { max-width: 480px; margin: 0 auto 32px; animation: rise .5s var(--spring) .1s both; }
  .search-box input {
    width: 100%; padding: 12px 18px; border-radius: 14px; border: 1.5px solid var(--border);
    background: var(--card); font-size: 14px; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .search-box input:focus { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(0,113,227,.1); }

  .group { margin-bottom: 28px; animation: rise .5s var(--spring) both; }
  .group-title {
    font-size: 13px; font-weight: 650; color: var(--sub); letter-spacing: .05em;
    text-transform: uppercase; margin: 0 4px 12px; display: flex; align-items: center; gap: 8px;
  }
  .group-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .cmd {
    background: var(--card); border-radius: 14px; padding: 14px 16px;
    border: 1px solid var(--border); transition: transform .2s var(--spring), box-shadow .2s;
  }
  .cmd:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.06); }
  .cmd-name { font-size: 13px; font-weight: 650; color: var(--blue); font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  .cmd-desc { font-size: 12px; color: var(--sub); line-height: 1.5; margin-top: 5px; }

  .badge { font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
  .b-core { background: rgba(0,113,227,.1); color: var(--blue); }
  .b-taste { background: rgba(175,82,222,.1); color: #8b3cc0; }

  .empty { text-align: center; color: var(--sub); font-size: 13px; padding: 40px 0; display: none; }
  footer { text-align: center; color: var(--sub); font-size: 11px; margin-top: 40px; }

  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⌘ Claude Code 命令手册</h1>
    <p class="sub">所有可用的 slash 命令与功能速查 · 本机 ~/.claude/skills 实时生成</p>
    <span class="count" id="total"></span>
  </header>

  <div class="search-box">
    <input id="search" type="text" placeholder="搜索命令或功能… 如：review / 设计 / pdf">
  </div>

  <div id="groups"></div>
  <p class="empty" id="empty">没有匹配的命令</p>
  <footer>生成于 2026-08-05 · 输入 <code>/命令名</code> 调用 · gstack 全家桶 + taste-skill 系列 + 自定义</footer>
</div>

    ["imagegen-frontend-mobile", "生成移动端 App 原生质感屏幕概念图", "taste"],

  ]},
  { title: "文档 · Office · 文件工具", items: [
    ["pdf", "PDF 一切：读取/提取文本表格/合并/转换", "core"],
    ["docx", "Word 文档一切：创建/读取/编辑 .docx", "core"],

  ]},
  { title: "开发辅助 · 其他", items: [
    ["claude-api", "Claude API / Anthropic SDK 开发指南", "core"],
    ["mcp-builder", "构建高质量 MCP Server 指南", "core"],
    ["skill-creator", "创建/修改/评测 skill", "core"],
    ["full-output-enforcement", "强制完整输出：禁止占位符/优雅处理 token 截断", "core"],
    ["setup-browser-cookies", "导入浏览器 cookies", "core"],
    ["retro", "每周工程回顾", "core"],
  ]},
];

const CMD_COUNT = GROUPS.reduce((n, g) => n + g.items.length, 0);
document.getElementById("total").textContent = CMD_COUNT + " 个命令";

function escapeHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function render(filter) {
  const root = document.getElementById("groups");
  root.innerHTML = "";
  let shown = 0;
  for (const g of GROUPS) {
    const items = g.items.filter(([name, desc]) =>
      !filter || name.includes(filter) || desc.includes(filter)
    );
    if (!items.length) continue;
    shown += items.length;
    const sec = document.createElement("section");
    sec.className = "group";
    sec.innerHTML = `
      <div class="group-title">${escapeHtml(g.title)}</div>
      <div class="grid">
        ${items.map(([name, desc, badge]) => `
          <div class="cmd">
            <div><span class="cmd-name">/${escapeHtml(name)}</span>
            ${badge ? `<span class="badge ${badge === 'taste' ? 'b-taste' : 'b-core'}">${badge === 'taste' ? 'taste' : 'gstack'}</span>` : ''}</div>
            <div class="cmd-desc">${escapeHtml(desc)}</div>
          </div>`).join("")}
      </div>`;
    root.appendChild(sec);
  }
  document.getElementById("empty").style.display = shown ? "none" : "block";
}

document.getElementById("search").addEventListener("input", (e) => render(e.target.value.trim().toLowerCase()));
render("");
</script>
</body>
</html>
